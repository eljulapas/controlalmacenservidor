# Configuración para la conexión con la base de datos
spring.application.name=demo1
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/controlalmacen
spring.datasource.username=elorrieta
spring.datasource.password=manana
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate (JPA)
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuración para que el servidor acepte conexiones externas
server.address=0.0.0.0
server.port=8080


# Configuración de correo (ejemplo para Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ponertucorreo@gmail.com
spring.mail.password=ponercontraseña
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
